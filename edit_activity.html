
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Activity - DAMS</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        /* HEADER */

        .top-header {
            background: linear-gradient(135deg, #123f91, #0dcaf0);
            color: white;
            padding: 22px 0;
        }

        .brand {
            font-size: 27px;
            font-weight: bold;
        }

        .brand i {
            margin-right: 8px;
        }

        .system-name {
            font-size: 14px;
            opacity: 0.9;
        }

        /* MAIN */

        .main-container {
            max-width: 850px;
            margin: 45px auto;
        }

        /* CARD */

        .activity-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.09);
        }

        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 25px 30px;
        }

        .card-header-custom h2 {
            margin: 0;
            font-weight: bold;
        }

        .card-header-custom p {
            margin: 6px 0 0;
            opacity: 0.9;
        }

        .form-area {
            padding: 35px;
        }

        .form-label {
            font-weight: bold;
            color: #183b6b;
        }

        .input-group-text {
            background: #eaf3ff;
            color: #0d6efd;
            min-width: 45px;
            justify-content: center;
        }

        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 8px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        /* BUTTONS */

        .btn-update {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-update:hover {
            background: #0b5ed7;
            color: white;
        }

        .btn-back {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* FOOTER */

        .footer {
            background: #203c63;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 50px;
        }

        @media (max-width: 768px) {

            .main-container {
                margin: 25px 15px;
            }

            .form-area {
                padding: 25px 20px;
            }

        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="top-header">

        <div class="container">

            <div class="brand">
                <i class="bi bi-mortarboard-fill"></i>
                DAMS
            </div>

            <div class="system-name">
                Department Activity Management System
            </div>

        </div>

    </div>


    <!-- MAIN -->

    <div class="container main-container">

        <div class="activity-card">

            <!-- CARD HEADER -->

            <div class="card-header-custom">

                <h2>
                    <i class="bi bi-pencil-square"></i>
                    Edit Activity
                </h2>

                <p>
                    Update department activity information
                </p>

            </div>


            <!-- FORM -->

            <div class="form-area">

                <form action="/update_activity" method="POST">

                    <!-- Activity ID -->

                    <input
                        type="hidden"
                        name="activityid"
                        value="{{ activity[0] }}">


                    <div class="row">

                        <!-- Activity Name -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Activity Name
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-calendar-event"></i>
                                </span>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    value="{{ activity[1] }}"
                                    required>

                            </div>

                        </div>


                        <!-- Activity Type -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Activity Type
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-tags"></i>
                                </span>

                                <input
                                    type="text"
                                    name="type"
                                    class="form-control"
                                    value="{{ activity[2] }}"
                                    required>

                            </div>

                        </div>


                        <!-- Activity Date -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Activity Date
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-calendar3"></i>
                                </span>

                                <input
                                    type="date"
                                    name="date"
                                    class="form-control"
                                    value="{{ activity[3] }}"
                                    required>

                            </div>

                        </div>


                        <!-- Venue -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Venue
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-geo-alt"></i>
                                </span>

                                <input
                                    type="text"
                                    name="venue"
                                    class="form-control"
                                    value="{{ activity[4] }}"
                                    required>

                            </div>

                        </div>


                        <!-- Organizer -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Organizer
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person-badge"></i>
                                </span>

                                <input
                                    type="text"
                                    name="organizer"
                                    class="form-control"
                                    value="{{ activity[5] }}"
                                    required>

                            </div>

                        </div>


                        <!-- Description -->

                        <div class="col-12 mb-4">

                            <label class="form-label">
                                Description
                            </label>

                            <div class="input-group">

                                <span class="input-group-text align-items-start pt-3">
                                    <i class="bi bi-card-text"></i>
                                </span>

                                <textarea
                                    name="description"
                                    class="form-control"
                                    placeholder="Enter activity description">{{ activity[6] }}</textarea>

                            </div>

                        </div>

                    </div>


                    <!-- BUTTONS -->

                    <div class="d-flex gap-2 mt-2">

                        <button
                            type="submit"
                            class="btn-update">

                            <i class="bi bi-check-circle-fill"></i>
                            Update Activity

                        </button>


                        <a
                            href="/activities"
                            class="btn btn-secondary btn-back">

                            <i class="bi bi-arrow-left"></i>
                            Back to Activities

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <footer class="footer">

        <div>
            © 2026 DAMS - Department Activity Management System
        </div>

        <small>
            Department Activity Management System
        </small>

    </footer>

</body>

</html>
