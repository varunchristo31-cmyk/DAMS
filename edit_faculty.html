<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Faculty - DAMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .top-header {
            background: linear-gradient(135deg, #123f91, #0dcaf0);
            color: white;
            padding: 22px 0;
        }

        .brand {
            font-size: 26px;
            font-weight: bold;
        }

        .brand i {
            margin-right: 8px;
        }

        .system-name {
            font-size: 14px;
            opacity: 0.9;
        }

        .main-container {
            max-width: 850px;
            margin: 45px auto;
        }

        .edit-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.09);
            overflow: hidden;
        }

        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 25px 30px;
        }

        .card-header-custom h2 {
            margin: 0;
            font-weight: bold;
        }

        .card-header-custom p {
            margin: 6px 0 0;
            opacity: 0.9;
        }

        .form-area {
            padding: 35px;
        }

        .form-label {
            font-weight: bold;
            color: #183b6b;
        }

        .input-group-text {
            background: #eaf3ff;
            color: #0d6efd;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .btn-update {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-update:hover {
            background: #0b5ed7;
        }

        .btn-back {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .footer {
            background: #203c63;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 50px;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="top-header">

        <div class="container">

            <div class="brand">

                <i class="bi bi-mortarboard-fill"></i>
                DAMS

            </div>

            <div class="system-name">

                Department Activity Management System

            </div>

        </div>

    </div>


    <!-- MAIN -->

    <div class="container main-container">

        <div class="edit-card">

            <div class="card-header-custom">

                <h2>

                    <i class="bi bi-pencil-square"></i>
                    Edit Faculty

                </h2>

                <p>
                    Update faculty information
                </p>

            </div>


            <div class="form-area">

                <form
                    action="/update_faculty"
                    method="POST">

                    <!-- IMPORTANT: Faculty ID -->

                    <input
                        type="hidden"
                        name="id"
                        value="{{ faculty[0] }}">


                    <div class="row">

                        <!-- Faculty Name -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Faculty Name
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person-badge"></i>
                                </span>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    value="{{ faculty[1] }}"
                                    required>

                            </div>

                        </div>


                        <!-- Department -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Department
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-building"></i>
                                </span>

                                <input
                                    type="text"
                                    name="department"
                                    class="form-control"
                                    value="{{ faculty[2] }}"
                                    required>

                            </div>

                        </div>


                        <!-- Designation -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Designation
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-award"></i>
                                </span>

                                <input
                                    type="text"
                                    name="designation"
                                    class="form-control"
                                    value="{{ faculty[3] }}"
                                    required>

                            </div>

                        </div>


                        <!-- Email -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Email
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    value="{{ faculty[4] or '' }}">

                            </div>

                        </div>


                        <!-- Phone -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Phone
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-phone"></i>
                                </span>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    value="{{ faculty[5] or '' }}">

                            </div>

                        </div>

                    </div>


                    <!-- BUTTONS -->

                    <div class="d-flex gap-2 mt-3">

                        <button
                            type="submit"
                            class="btn-update">

                            <i class="bi bi-check-circle"></i>
                            Update Faculty

                        </button>


                        <a
                            href="/view_faculty"
                            class="btn btn-secondary btn-back">

                            <i class="bi bi-arrow-left"></i>
                            Back to Faculty List

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <footer class="footer">

        <div>
            © 2026 DAMS - Department Activity Management System
        </div>

        <small>
            Department Activity Management System
        </small>

    </footer>

</body>

</html>
