<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Certificate - DAMS</title>

```

      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
```

</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                <i class="bi bi-pencil-square"></i>
                Edit Certificate
            </h4>
        </div>

```
    <div class="card-body">

        <form action="/update_certificate" method="POST">

            <input type="hidden"
                   name="certificateid"
                   value="{{ certificate[0] }}">

            <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="number"
                       name="studentid"
                       class="form-control"
                       value="{{ certificate[1] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text"
                       name="studentname"
                       class="form-control"
                       value="{{ certificate[2] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Activity ID</label>
                <input type="number"
                       name="activityid"
                       class="form-control"
                       value="{{ certificate[3] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Activity Name</label>
                <input type="text"
                       name="activityname"
                       class="form-control"
                       value="{{ certificate[4] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Certificate Type</label>

                <select name="certificatetype"
                        class="form-select"
                        required>

                    <option value="Participation"
                        {% if certificate[5] == 'Participation' %}selected{% endif %}>
                        Participation
                    </option>

                    <option value="Achievement"
                        {% if certificate[5] == 'Achievement' %}selected{% endif %}>
                        Achievement
                    </option>

                    <option value="Winner"
                        {% if certificate[5] == 'Winner' %}selected{% endif %}>
                        Winner
                    </option>

                    <option value="Appreciation"
                        {% if certificate[5] == 'Appreciation' %}selected{% endif %}>
                        Appreciation
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Certificate Date</label>

                <input type="date"
                       name="certificatedate"
                       class="form-control"
                       value="{{ certificate[6][:10] if certificate[6] else '' }}"
                       required>
            </div>

            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle"></i>
                    Update Certificate
                </button>

                <a href="/certificates" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Back
                </a>

            </div>

        </form>

    </div>
</div>
```

</div>

</body>
</html>
