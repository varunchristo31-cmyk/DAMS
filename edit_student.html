<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student - DAMS</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        /* Header */
        .top-header {
            background: linear-gradient(135deg, #123f91, #0dcaf0);
            color: white;
            padding: 22px 0;
        }

        .brand {
            font-size: 26px;
            font-weight: bold;
        }

        .brand i {
            margin-right: 8px;
        }

        .system-name {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Main */
        .main-container {
            max-width: 850px;
            margin: 45px auto;
        }

        /* Card */
        .edit-card {
            background: white;
            border: none;
            border-radius: 18px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.09);
            overflow: hidden;
        }

        /* Card Header */
        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 25px 30px;
        }

        .card-header-custom h2 {
            margin: 0;
            font-weight: bold;
        }

        .card-header-custom p {
            margin: 6px 0 0;
            opacity: 0.9;
        }

        /* Form */
        .form-area {
            padding: 35px;
        }

        .form-label {
            font-weight: bold;
            color: #183b6b;
        }

        .input-group-text {
            background: #eaf3ff;
            color: #0d6efd;
            border: 1px solid #ced4da;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        /* Update Button */
        .btn-update {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-update:hover {
            background: #0b5ed7;
            color: white;
        }

        /* Back Button */
        .btn-back {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Footer */
        .footer {
            background: #203c63;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 50px;
        }

        /* Mobile */
        @media (max-width: 768px) {

            .main-container {
                margin: 25px 15px;
            }

            .form-area {
                padding: 25px 20px;
            }

            .card-header-custom {
                padding: 20px;
            }

            .card-header-custom h2 {
                font-size: 22px;
            }

            .btn-update,
            .btn-back {
                padding: 10px 18px;
            }
        }
    </style>

</head>

<body>

    <!-- ================= HEADER ================= -->

    <div class="top-header">

        <div class="container">

            <div class="brand">
                <i class="bi bi-mortarboard-fill"></i>
                DAMS
            </div>

            <div class="system-name">
                Department Activity Management System
            </div>

        </div>

    </div>


    <!-- ================= MAIN CONTENT ================= -->

    <div class="container main-container">

        <div class="edit-card">

            <!-- Card Header -->

            <div class="card-header-custom">

                <h2>
                    <i class="bi bi-pencil-square"></i>
                    Edit Student
                </h2>

                <p>
                    Update student information
                </p>

            </div>


            <!-- ================= FORM ================= -->

            <div class="form-area">

                <form action="/update_student" method="POST">

                    <!--
                        IMPORTANT:
                        Flask update_student() expects request.form['id']
                    -->

                    <input
                        type="hidden"
                        name="id"
                        value="{{ student[0] }}">


                    <div class="row">

                        <!-- ================= REGISTER NO ================= -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Register No
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-card-text"></i>
                                </span>

                                <input
                                    type="text"
                                    name="regno"
                                    class="form-control"
                                    value="{{ student[1] }}"
                                    placeholder="Enter Register Number"
                                    required>

                            </div>

                        </div>


                        <!-- ================= STUDENT NAME ================= -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Student Name
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    value="{{ student[2] }}"
                                    placeholder="Enter Student Name"
                                    required>

                            </div>

                        </div>


                        <!-- ================= DEPARTMENT ================= -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Department
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-building"></i>
                                </span>

                                <input
                                    type="text"
                                    name="department"
                                    class="form-control"
                                    value="{{ student[3] }}"
                                    placeholder="Enter Department"
                                    required>

                            </div>

                        </div>


                        <!-- ================= YEAR ================= -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Year of Study
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-calendar3"></i>
                                </span>

                                <input
                                    type="number"
                                    name="year"
                                    class="form-control"
                                    value="{{ student[4] }}"
                                    placeholder="Enter Year"
                                    min="1"
                                    max="6"
                                    required>

                            </div>

                        </div>


                        <!-- ================= EMAIL ================= -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Email
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    value="{{ student[5] }}"
                                    placeholder="Enter Email">

                            </div>

                        </div>


                        <!-- ================= MOBILE ================= -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Mobile No
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-phone"></i>
                                </span>

                                <input
                                    type="text"
                                    name="mobile"
                                    class="form-control"
                                    value="{{ student[6] }}"
                                    placeholder="Enter Mobile Number">

                            </div>

                        </div>

                    </div>


                    <!-- ================= BUTTONS ================= -->

                    <div class="d-flex gap-2 mt-3">

                        <!-- Update -->

                        <button
                            type="submit"
                            class="btn-update">

                            <i class="bi bi-check-circle"></i>
                            Update Student

                        </button>


                        <!-- Back -->

                        <a
                            href="/view_students"
                            class="btn btn-secondary btn-back">

                            <i class="bi bi-arrow-left"></i>
                            Back to Student List

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div>
            © 2026 DAMS - Department Activity Management System
        </div>

        <small>
            Department Activity Management System
        </small>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
