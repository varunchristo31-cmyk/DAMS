
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DAMS Login</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>
        /* GENERAL PAGE DESIGN */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #e8fbff);
        }

        /* LOGIN CARD */
        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 35px 32px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(18, 63, 145, 0.15);
        }

        /* DAMS PROJECT LOGO */
        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .dams-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 15px;
            background: linear-gradient(135deg, #123f91, #0dcaf0);
            box-shadow: 0 5px 15px rgba(18, 63, 145, 0.20);
        }

        .logo-icon {
            color: white;
            font-size: 42px;
            line-height: 1;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .logo-title {
            color: white;
            font-size: 35px;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .logo-subtitle {
            color: white;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 5px;
            white-space: nowrap;
        }

        /* LOGIN HEADING */
        .login-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-heading h1 {
            color: #123f91;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .login-heading p {
            color: #6c757d;
            font-size: 14px;
            margin: 0;
        }

        /* FORM LABELS */
        .form-label {
            color: #343a40;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* INPUT FIELDS */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group-text {
            color: #123f91;
            background: #f0f5ff;
            border: 1px solid #dce5f2;
        }

        .form-control {
            min-height: 48px;
            border: 1px solid #dce5f2;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #0dcaf0;
            box-shadow: 0 0 0 0.2rem rgba(13, 202, 240, 0.15);
        }

        /* PASSWORD VISIBILITY BUTTON */
        .password-toggle {
            min-height: 48px;
            color: #123f91;
            background: #ffffff;
            border: 1px solid #dce5f2;
            cursor: pointer;
        }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;
            min-height: 48px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #123f91, #0dcaf0);
            transition: 0.3s ease;
        }

        .login-btn:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(18, 63, 145, 0.20);
        }

        /* ERROR MESSAGE */
        .error-message {
            padding: 11px 13px;
            margin-bottom: 20px;
            border-radius: 8px;
            color: #842029;
            background: #f8d7da;
            border: 1px solid #f5c2c7;
            font-size: 14px;
        }

        /* FOOTER */
        .login-footer {
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #eeeeee;
            text-align: center;
            color: #888888;
            font-size: 12px;
        }

        /* MOBILE RESPONSIVE DESIGN */
        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }

            .dams-logo {
                gap: 9px;
                padding: 12px 15px;
            }

            .logo-icon {
                font-size: 34px;
            }

            .logo-title {
                font-size: 29px;
            }

            .logo-subtitle {
                font-size: 8px;
                letter-spacing: 0.5px;
            }

            .login-heading h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- DAMS LOGO -->
        <div class="login-logo">
            <div class="dams-logo">

                <i class="bi bi-mortarboard-fill logo-icon"></i>

                <div class="logo-text">
                    <div class="logo-title">DAMS</div>
                    <div class="logo-subtitle">ACADEMIC MANAGEMENT</div>
                </div>

            </div>
        </div>

        <!-- LOGIN HEADING -->
        <div class="login-heading">
            <h1>DAMS Login</h1>
            <p>Department Activity Management System</p>
        </div>

        <!-- ERROR MESSAGE -->
        {% if error %}
            <div class="error-message" role="alert">
                <i class="bi bi-exclamation-circle-fill"></i>
                {{ error }}
            </div>
        {% endif %}

        <!-- LOGIN FORM -->
        <form method="POST" action="{{ url_for('login') }}">

            <!-- USERNAME -->
            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-4">
                <label for="password" class="form-label">
                    Password
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        class="btn password-toggle"
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        <i class="bi bi-eye-fill" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" class="btn login-btn">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Login
            </button>

        </form>

        <!-- FOOTER -->
        <div class="login-footer">
            &copy; 2026 DAMS. All Rights Reserved.
        </div>

    </div>

    <!-- PASSWORD VISIBILITY SCRIPT -->
    <script>
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");

        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.remove("bi-eye-fill");
                eyeIcon.classList.add("bi-eye-slash-fill");
                togglePassword.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.remove("bi-eye-slash-fill");
                eyeIcon.classList.add("bi-eye-fill");
                togglePassword.setAttribute("aria-label", "Show password");
            }
        });
    </script>

</body>
</html>
