<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student - DAMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .page-container {
            max-width: 950px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .header {
            background: #212529;
            color: white;
            padding: 20px 25px;
            border-radius: 12px 12px 0 0;
        }

        .header h2 {
            margin: 0;
            font-weight: bold;
        }

        .header p {
            margin: 5px 0 0;
            color: #ced4da;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 8px;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .buttons {
            margin-top: 30px;
        }

        .buttons .btn {
            padding: 10px 20px;
            border-radius: 8px;
        }

    </style>
</head>

<body>

<div class="page-container">

    <!-- Header -->

    <div class="header">

        <h2>
            <i class="bi bi-person-plus-fill"></i>
            Add Student
        </h2>

        <p>Department Activity Management System</p>

    </div>


    <!-- Form -->

    <div class="form-card">

        <form action="/add_student" method="POST">

            <div class="row g-4">

                <!-- Register No -->

                <div class="col-md-6">

                    <label class="form-label">
                        Register No
                    </label>

                    <input
                        type="text"
                        name="regno"
                        class="form-control"
                        placeholder="Enter Register Number"
                        required>

                </div>


                <!-- Student Name -->

                <div class="col-md-6">

                    <label class="form-label">
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter Student Name"
                        required>

                </div>


                <!-- Department -->

                <div class="col-md-6">

                    <label class="form-label">
                        Department
                    </label>

                    <input
                        type="text"
                        name="department"
                        class="form-control"
                        placeholder="Enter Department"
                        required>

                </div>


                <!-- Year -->

                <div class="col-md-6">

                    <label class="form-label">
                        Year of Study
                    </label>

                    <select
                        name="year"
                        class="form-select"
                        required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="1">
                            1st Year
                        </option>

                        <option value="2">
                            2nd Year
                        </option>

                        <option value="3">
                            3rd Year
                        </option>

                    </select>

                </div>


                <!-- Email -->

                <div class="col-md-6">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter Email Address"
                        required>

                </div>


                <!-- Mobile -->

                <div class="col-md-6">

                    <label class="form-label">
                        Mobile No
                    </label>

                    <input
                        type="tel"
                        name="mobile"
                        class="form-control"
                        placeholder="Enter Mobile Number"
                        maxlength="10"
                        required>

                </div>

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <button
                    type="submit"
                    class="btn btn-primary me-2">

                    <i class="bi bi-person-plus-fill"></i>
                    Add Student

                </button>


                <a
                    href="/view_students"
                    class="btn btn-outline-secondary me-2">

                    <i class="bi bi-people-fill"></i>
                    View Students

                </a>


                <a
                    href="/dashboard"
                    class="btn btn-outline-dark">

                    <i class="bi bi-arrow-left"></i>
                    Back to Dashboard

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
