
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Event Registration - DAMS</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f4f7fb;
        }

        .edit-container {
            max-width: 750px;
            margin: 50px auto;
        }

        .card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
        }

        .card-header h3 {
            margin: 0;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
        }

        .btn {
            border-radius: 8px;
        }

    </style>

</head>


<body>


<div class="container edit-container">

    <div class="card shadow">


        <!-- HEADER -->

        <div class="card-header bg-primary text-white">

            <h3>
                <i class="bi bi-pencil-square"></i>
                Edit Event Registration
            </h3>

        </div>


        <!-- BODY -->

        <div class="card-body p-4">


            <form action="/update_event" method="POST">


                <!-- Registration ID -->

                <input
                    type="hidden"
                    name="id"
                    value="{{ registration[0] }}">


                <!-- Student ID -->

                <div class="mb-3">

                    <label class="form-label">
                        Student ID
                    </label>

                    <input
                        type="number"
                        name="studentid"
                        class="form-control"
                        value="{{ registration[1] }}"
                        required>

                </div>


                <!-- Student Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="studentname"
                        class="form-control"
                        value="{{ registration[2] }}"
                        required>

                </div>


                <!-- Activity ID -->

                <div class="mb-3">

                    <label class="form-label">
                        Activity ID
                    </label>

                    <input
                        type="number"
                        name="activityid"
                        class="form-control"
                        value="{{ registration[3] }}"
                        required>

                </div>


                <!-- Activity Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Activity Name
                    </label>

                    <input
                        type="text"
                        name="activityname"
                        class="form-control"
                        value="{{ registration[4] }}"
                        required>

                </div>


                <!-- Registration Date -->

                <div class="mb-4">

                    <label class="form-label">
                        Registration Date
                    </label>

                    <input
                        type="date"
                        name="registrationdate"
                        class="form-control"
                        value="{{ registration_date }}"
                        required>

                </div>


                <!-- BUTTONS -->

                <div class="d-flex gap-2">

                    <!-- UPDATE -->

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-check-circle"></i>
                        Update Registration

                    </button>


                    <!-- BACK -->

                    <a
                        href="{{ url_for('view_event_registrations') }}"
                        class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>
                        Back

                    </a>

                </div>


            </form>


        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
