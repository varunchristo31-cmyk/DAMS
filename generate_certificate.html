<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DAMS Certificate</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .certificate {
            width: 1050px;
            height: 740px;
            margin: 40px auto;
            background: #fffdf5;
            position: relative;
            padding: 55px;
            border: 12px solid #123f91;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            overflow: hidden;
        }

        .certificate::before {
            content: "";
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            bottom: 18px;
            border: 3px solid #0dcaf0;
            pointer-events: none;
        }

        .corner {
            position: absolute;
            font-size: 55px;
            color: #123f91;
            z-index: 2;
        }

        .top-left {
            top: 15px;
            left: 25px;
        }

        .top-right {
            top: 15px;
            right: 25px;
        }

        .bottom-left {
            bottom: 10px;
            left: 25px;
        }

        .bottom-right {
            bottom: 10px;
            right: 25px;
        }

        .logo {
            font-size: 55px;
            color: #123f91;
            margin-bottom: 5px;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #123f91;
            margin-top: 5px;
        }

        .subtitle {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #0dcaf0;
        }

        .presented {
            margin-top: 35px;
            font-size: 18px;
            color: #555;
        }

        .student-name {
            font-size: 38px;
            font-weight: bold;
            color: #111;
            margin: 15px 0;
            border-bottom: 2px solid #123f91;
            display: inline-block;
            padding: 0 45px 8px;
        }

        .description {
            font-size: 18px;
            color: #555;
            margin-top: 15px;
        }

        .activity {
            font-size: 30px;
            font-weight: bold;
            color: #123f91;
            margin: 12px 0;
        }

        .date {
            position: absolute;
            bottom: 75px;
            left: 80px;
            font-size: 16px;
            color: #444;
        }

        .coordinator {
            position: absolute;
            bottom: 65px;
            right: 80px;
            font-size: 16px;
            color: #444;
        }

        .coordinator-line {
            border-top: 2px solid #333;
            width: 200px;
            margin-bottom: 8px;
        }

        .buttons {
            text-align: center;
            margin: 25px auto 40px;
        }

        @media print {

            .buttons {
                display: none;
            }

            body {
                background: white;
            }

            .certificate {
                margin: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <!-- CERTIFICATE -->
    <div class="certificate" id="certificate">

        <!-- Decorative Corners -->
        <div class="corner top-left">❦</div>
        <div class="corner top-right">❧</div>
        <div class="corner bottom-left">❧</div>
        <div class="corner bottom-right">❦</div>

        <!-- Icon -->
        <div class="logo">
            <i class="bi bi-award-fill"></i>
        </div>

        <!-- Title -->
        <div class="title">
            CERTIFICATE
        </div>

        <div class="subtitle">
            OF {{ certificate[5]|upper }}
        </div>

        <!-- Content -->
        <div class="presented">
            This certificate is proudly presented to
        </div>

        <div class="student-name">
            {{ certificate[2] }}
        </div>

        <div class="description">
            for successfully participating in
        </div>

        <div class="activity">
            {{ certificate[4] }}
        </div>

        <div class="description">
            organized by the Department of Computer Science
        </div>

        <!-- Date -->
        <div class="date">
            <strong>Date</strong><br>
            {{ certificate[6] }}
        </div>

        <!-- Coordinator -->
        <div class="coordinator">

            <div class="coordinator-line"></div>

            <strong>Department Coordinator</strong><br>
            Department of Computer Science

        </div>

    </div>


    <!-- BUTTONS -->
    <div class="buttons">

        <button
            type="button"
            class="btn btn-primary btn-lg me-2"
            onclick="downloadCertificate()">

            <i class="bi bi-download"></i>
            Download Certificate

        </button>


        <button
            type="button"
            class="btn btn-secondary btn-lg"
            onclick="goBack()">

            <i class="bi bi-arrow-left"></i>
            Back

        </button>

    </div>


    <script>

        // DOWNLOAD CERTIFICATE AS PDF
        function downloadCertificate() {

            const certificate =
                document.getElementById("certificate");

            const studentName =
                "{{ certificate[2] }}";

            const fileName =
                "DAMS_Certificate_" +
                studentName.replace(/\s+/g, "_") +
                ".pdf";


            const options = {

                margin: 0,

                filename: fileName,

                image: {
                    type: "jpeg",
                    quality: 1
                },

                html2canvas: {

                    scale: 2,

                    useCORS: true,

                    backgroundColor: "#fffdf5"

                },

                jsPDF: {

                    unit: "px",

                    format: [1050, 740],

                    orientation: "landscape"

                }

            };


            html2pdf()
                .set(options)
                .from(certificate)
                .save();

        }


        // BACK BUTTON
        function goBack() {

            window.location.href = "/dashboard";

        }

    </script>

</body>

</html>
